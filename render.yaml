services:
  - type: web
    name: hanami-hair-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build --workspace @hanami/api
    startCommand: npm run start --workspace @hanami/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

